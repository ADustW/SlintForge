[package]
name = "slintforge-gallery-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
slint = { version = "=1.18.0", features = ["renderer-skia"] }
slintforge = { path = "../../sdk/rust", features = ["flow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.18.0"
slintforge-build = { path = "../../sdk/rust-build" }
embed-resource = "=3.0.11"

[dev-dependencies]
i-slint-backend-testing = "=1.18.0"
i-slint-core = "=1.18.0"
