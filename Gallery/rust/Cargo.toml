[package]
name = "slintforge-gallery-rust"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
slint = { version = "=1.18.0", features = ["renderer-skia"] }
slintforge = { path = "../../sdk/rust", features = ["flow"] }

[build-dependencies]
slint-build = "=1.18.0"
slintforge-build = { path = "../../sdk/rust-build" }
embed-resource = "=3.0.11"

[dev-dependencies]
i-slint-backend-testing = "=1.18.0"
i-slint-core = "=1.18.0"
