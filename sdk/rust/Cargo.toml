[package]
name = "slintforge"
version = "0.1.0"
edition = "2021"
description = "SlintForge 路由与导航树宿主模型"

[lib]
path = "src/lib.rs"

[dependencies]
slint = { version = "=1.18.0", features = ["raw-window-handle-06"] }
png = "=0.18.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
slintforge-qrcodegen = { path = "../../third_party/qrcodegen/rust" }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
