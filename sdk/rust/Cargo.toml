[package]
name = "slintforge"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"
authors = ["陕西禾又科技有限责任公司"]
rust-version = "1.98.0"
publish = false
description = "SlintForge 原生 Rust 接口与 DLL 安全封装"
[features]
flow = ["slint/renderer-skia"]
[dependencies]
slint = { version = "=1.18.0", features = ["raw-window-handle-06", "renderer-skia"] }
slintforge-runtime-api = { version = "=0.1.2", path = "../runtime-api" }
slintforge-build = { version = "=0.1.2", path = "../rust-build" }
libloading = "=0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
[dev-dependencies]
png = "=0.18.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
