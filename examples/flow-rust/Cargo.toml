[package]
name = "slintforge-flow-example"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
slint = { version = "=1.18.0", features = ["renderer-skia", "unstable-wgpu-30"] }
slintforge = { path = "../../sdk/rust", features = ["flow"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.18.0"
slintforge-build = { path = "../../sdk/rust-build" }
