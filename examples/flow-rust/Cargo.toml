[package]
name = "slintforge-flow-example"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
slint = { version = "=1.18.0", features = ["renderer-skia", "unstable-wgpu-30"] }
slintforge = { path = "../../sdk/rust", features = ["flow"] }
serde_json = "1"
# 仅窗口验收注入手势使用，与 Slint 固定版本一致；业务 SDK 不依赖该内部接口。
i-slint-core = "=1.18.0"

[build-dependencies]
slint-build = "=1.18.0"
slintforge-build = { path = "../../sdk/rust-build" }
